<!DOCTYPE html>
<html>

<head>
    <title>My experiment</title>
    <script src="jsPsych/jspsych.js"></script>
    <script src="jsPsych/plugin-html-button-response.js"></script>
    <script src="jsPsych/plugin-html-keyboard-response.js"></script>
    <script src="jsPsych/assignment-inference_tactileAC.js"></script>
    <script src="jsPsych/plugin-fullscreen.js"></script>
    <script src="jsPsych/plugin-survey-text.js"></script>
    <script src="jsPsych/plugin-survey-multi-select.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-image-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>


    <link href="jsPsych/jspsychMAS.css" rel="stylesheet" type="text/css">
</head>

<body></body>
<script>
    async function startExperiment() {
        //Start jsPsych Experiment!!!

        function generateDirectionalPairs(pairs) {
            const combinations = [];
            for (let i = 0; i < pairs.length; i++) {
                for (let j = i + 1; j < pairs.length; j++) {
                    combinations.push({ left: pairs[i], right: pairs[j] });
                    combinations.push({ left: pairs[j], right: pairs[i] });
                }
            }
            return combinations;
        }



        //Initiate jsPsych
        var jsPsych = initJsPsych({
            on_finish: function () {
                // Save data locally as CSV
                jsPsych.data.get().localSave('csv', 'experiment_data.csv');
            }
        });

        /*const sona_id = jsPsych.data.getURLVariable('id');
        var participant_id = jsPsych.randomization.randomID(10);
        const filename = `${participant_id}.csv`;

        // Add it to every trial's data
        jsPsych.data.addProperties({
            sona_id: sona_id,
            participant_id: participant_id
        });*/

        //Create timeline
        let timeline = [];


        //correct for data pipe
        const texture_cond = {
            "0": ['M53', 'P53', 'P0', 'F0', 'F24', 'G24'],
            "1": ['S24', 'S0', 'S22', 'G51', 'M24', 'P75'],
            //"2": ['P22', 'G51', 'M53', 'G75', 'S22', 'P53'],
            "2": ['G22', 'P22', 'P53', 'M102', 'S75', 'M53'],
            "3": ['M53', 'M0', 'S51', 'M24', 'P0', 'P75'],
        };

        const concept_cond = {
            "0": ["frog", "lion"],
            "1": ["corn", "eggplant"],
            "2": ["evil", "peace"],
            "3": ["comfort", "speed"]
        };

        // Set background color to gray //
        document.body.style.backgroundColor = "rgb(128,128,128)"

        // Prompt for participant ID
        var participant_id = prompt("Please enter the participant ID:");

        // Ensure input is valid
        if (!participant_id || isNaN(participant_id)) {
            alert("Invalid participant ID! Please reload the page and enter a numeric ID.");
            throw new Error("Invalid participant ID.");
        }

        // Calculate the condition index
        var condition_index = parseInt(participant_id) % 4;

        var subject_id = jsPsych.randomization.randomID(15);
        const filename = `${subject_id}.csv`;

        //ALL conditions
        console.log("participant_id:", participant_id)
        console.log("condition_index:", condition_index)
        //condition_num = condition_index - 1;
        condition_num = (parseInt(participant_id) - 1) % 4;
        if (condition_num < 0) condition_num += 4;
        console.log("condition_num:", condition_num)
        concept_list = concept_cond[condition_num]
        console.log("concept_list:", concept_list)
        concept_list = jsPsych.randomization.shuffle(concept_list);
        texture_list = jsPsych.randomization.shuffle(texture_cond[condition_num]);
        console.log("texture_list:", texture_list)

        concept_list = concept_cond[condition_num];
        concept_list = jsPsych.randomization.shuffle(concept_list);

        texture_list = texture_cond[condition_num];



        jsPsych.data.addProperties({
            subject_id: subject_id,
            participant_id: participant_id,
            condition_num: condition_num
        });


        //var participant_id = jsPsych.data.getURLVariable('participant_id') || Math.floor(Math.random() * 10000);
        //const filename = `participant_${participant_id}.csv`;

        // Initial welcome screen
        // Initial welcome screen
        var initial_screen = {
            type: jsPsychHtmlButtonResponse,
            stimulus: 'Welcome to the experiment!' +
                '<p>[At the bottom of this screen, you will see a button that says "Begin Experiment".]' +
                '<p>[Click the button to begin the experiment.]</p>',
            choices: ['Begin Experiment']
        }
        timeline.push(initial_screen);
        let preload_trial = {
            type: jsPsychPreload
        }
        timeline.push(preload_trial);

        timeline.push({
            type: jsPsychFullscreen,
            fullscreen_mode: true,
        })


        //Instructions for the experiment
        var instructions = {
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <div style=text-align:left;>
                <p>[Experimenter - Find and layout the 8 textures for this session: <b>${texture_list[0]}</b>, <b>${texture_list[1]}</b>, <b>${texture_list[2]}</b>, <b>${texture_list[3]}</b>, <b>${texture_list[4]}</b>, <b>${texture_list[5]}</b> and place the sample textures in the tray: <b>S53</b> LEFT, <b>F102</b> RIGHT. Set the bar heights in the sample tray to the top wide peg hole.]</p>
                <p>In this experiment you will be asked to imagine you are interpreting bar graphs representing data about the concepts, <b>${concept_list[0]}</b> and <b>${concept_list[1]}</b>.</p>
                <p>The bar graph will be presented in the box in front of you so that you won't be able to see it, but you can touch it. There is an example bar graph in the box now. I will now instruct you on how to explore the bar chart with your hand.</p> 
                <p>To start please put your hand into the box under the curtain near the front of the box. Now, slowly move your pointer finger forward until you find the starting dot. [Experimenter: instruct to help them find the starting dot]. </p> 
                <p>Now please slide your finger a little further forward to feel the base of the chart. Then please slide your finger further forward to feel the the ridge. This represents the x-axis of the chart.</p> 
                <p>Now, please slide your finger to the left along the x-axis until you feel the end and then slide your finger up to feel the y-axis. Good.</p> 
                <p>Now please slide your finger back down along the y-axis and toward you to find the dot where we started.</p> 
                <p>Next, I will instruct you to explore the two bars in the bar chart. Slide your finger toward the x-axis and keep going forward and slightly to the left to feel the bar on the left. Now, please slide your finger to the right to feel the bar on the right.</p> 
                <p>On each trial I will say a concept outloud. This is the target concept to judge on that trial, either: <b>${concept_list[0]}</b> or <b>${concept_list[1]}</b>.</p> 
                <p>Your task is to report which bar you think represents the target concept, either <b>${concept_list[0]}</b> or <b>${concept_list[1]}</b>.</p> 
                <p>Please use your pointer finger to feel each bar and then report which bar you think represents the target concept.</p>
                <p>If you think the LEFT bar represents the target concept, say "LEFT" outloud and tap the left bar twice with your finger. Please try that now.</p> 
                <p>If you think the RIGHT bar represents the target concept, say "RIGHT" outloud and tap the right bar twice with your finger. Please try that now.</p>
                <p>Please use your intuition about which bar represents the target concept.</p>  
                <p>After you respond, you may take your hand out of the box for a brief break while I prepare the next trial.</p> 
                <p>During the experiment trials, we will ask you to wear headphones that play sounds similar to the sound of rain in a forest. The reason is so that you do not hear the sound of your fingers moving across the textures. Please put the headphones on now.</p>
                <p>[Experimenter: Confirm the participants can hear the noise.]</p>
                <p>I will now say each concept word to confirm you can still hear the words through the noise. Please repeat each word after I say it: <b>${concept_list[0]}</b> and <b>${concept_list[1]}</b></p>
                <p>The experiment will take about 40 minutes, and there will be 4 blocks of trials. You will be notified when you have completed each block and you may take breaks when you need to. Do you have any questions?</p>
                <p>Great! Now we are eready to start the trials. Remember the concepts are <b>${concept_list[0]}</b> and <b>${concept_list[1]}</b>.
                <p>[Experimenter: Press 'Continue' when you are ready to begin.]<br></p> 
                </div>
                `,
            choices: ['Continue']
        };
        timeline.push(instructions);


        // heights
        var heights = {
            "short": [4, 4],
            "tall": [7, 7]
        };

        //define jitter in experiment, not plugin
        var jitter = 0;


        //all ordered texture pairs (no repeats)
        function getTexturePairs(textures) {
            var pairs = [];
            for (var i = 0; i < textures.length; i++) {
                for (var j = 0; j < textures.length; j++) {
                    if (i !== j) {
                        pairs.push([textures[i], textures[j]]);
                    }
                }
            }
            return pairs; // e.g., [ [red, blue], [blue, red], ... ]
        }

        //all height pairs (no repeats/duplicates)
        function getHeightPairs(heights) {
            var keys = Object.keys(heights);
            var pairs = [];
            for (var i = 0; i < keys.length; i++) {
                for (var j = 0; j < keys.length; j++) {
                    if (i !== j) {
                        pairs.push([keys[i], keys[j]]);
                    }
                }
            }
            return pairs;
        }

        var texture_pairs = getTexturePairs(texture_list);
        var height_pairs = getHeightPairs(heights);

        // Function to randomly pick an element from array
        function sample(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // Number of trials
        //var n_trials = 5;

        // Number of repetitions per concept
        //var n_reps = 2; // you can adjust

        // Shuffle the concept-side combos
        //concept_side_combos = jsPsych.randomization.shuffle(concept_side_combos);

        // Create trial
        var trials = [];
        concept_list.forEach(function (concept) {
            texture_pairs.forEach(function (texture_pairs) {
                height_pairs.forEach(function (height_pairs) {

                    //original heights
                    var left_bar_height = heights[height_pairs[0]];
                    var right_bar_height = heights[height_pairs[1]];

                    //jitter calculation
                    var left_jitter = Math.round((Math.random() * 2 - 1) * jitter);
                    var right_jitter = Math.round((Math.random() * 2 - 1) * jitter);

                    //final height
                    var final_left = left_bar_height[0] + left_jitter;
                    var final_right = right_bar_height[0] + right_jitter;

                    trials.push({
                        prompt: concept,
                        left_texture: texture_pairs[0],
                        right_texture: texture_pairs[1],

                        // Original height condition
                        left_bar_height: left_bar_height,
                        right_bar_height: right_bar_height,

                        // Jitter
                        left_jitter: left_jitter,
                        right_jitter: right_jitter,

                        // Actual height used
                        final_left: final_left,
                        final_right: final_right
                    });
                });
            });
        });
        console.log(trials[0]);
        console.log(trials.length);
        console.log(trials);

        var assign_trial = {
            type: jsPsychTextureBarChoice,
            prompt: jsPsych.timelineVariable('prompt'),
            left_height: jsPsych.timelineVariable('final_left'),
            right_height: jsPsych.timelineVariable('final_right'),
            left_texture: jsPsych.timelineVariable('left_texture'),
            right_texture: jsPsych.timelineVariable('right_texture'),
            next_trial: jsPsych.timelineVariable('next_trial'),
            bg_color: "rgb(128,128,128)",
            choices: ['arrowleft', 'arrowright'],
            response_ends_trial: true,

            on_finish: function (data) {
                console.log("Completed trial:", data);
            }
        };

        var iti = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<div style="font-size: 40px;">+</div>',   // blank screen
            choices: "NO_KEYS",  // no responses allowed
            trial_duration: 500
        };

        // Shuffle ALL trials once
        let shuffledTrials = jsPsych.randomization.shuffle([...trials]);

        // Split the shuffled trials into 4 blocks
        let blockSize = Math.ceil(shuffledTrials.length / 4);

        let blocks = [
            shuffledTrials.slice(0, blockSize),
            shuffledTrials.slice(blockSize, blockSize * 2),
            shuffledTrials.slice(blockSize * 2, blockSize * 3),
            shuffledTrials.slice(blockSize * 3)
        ];

        // Give every trial a reference to the next trial
        blocks.forEach(block => {
            for (let i = 0; i < block.length; i++) {
                block[i].next_trial = block[i + 1] || null;
            }
        });

        const totalBlocks = blocks.length;

        // Add each block to the timeline
        blocks.forEach((block, i) => {
            // Add the trials in this block
            timeline.push({
                timeline: [iti, assign_trial],
                timeline_variables: block.map(t => ({ ...t }))
                //randomize_order: true
            });

            // Add a break after every block EXCEPT the last one
            if (i < totalBlocks - 1) {
                timeline.push({
                    type: jsPsychHtmlButtonResponse,
                    stimulus: `
                <p>You have completed block ${i + 1} of ${totalBlocks}.</p>
                <p>Take a short break if needed, then click below to continue.</p>
            `,
                    choices: ['Continue']
                });
            }
        });


        // Compute total number of assign trials added to the timeline and log it
        let totalAssignTrials = 0;
        for (let i = 0; i < timeline.length; i++) {
            if (timeline[i].timeline_variables && Array.isArray(timeline[i].timeline_variables)) {
                totalAssignTrials += timeline[i].timeline_variables.length;
            }
        }


        console.log("Total assign trials in experiment:", totalAssignTrials);

        console.log("Participant ID:", participant_id);
        console.log("Assigned condition number:", condition_num);
        console.log("Assigned concepts:", concept_list);


        //save the data
        const save_data = {
            type: jsPsychPipe,
            action: "save",
            experiment_id: "jUWywKNYnBTs",
            filename: filename,
            wait_message: "Please wait while the next page loads.",
            data_string: () => jsPsych.data.get().csv()
        };
        timeline.push(save_data);

        var debrief_script = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<div style="width:800px">Great job! You have finished the experiment.' +
                '<p>The goal of this experiment is to investigate what factors influence the way people interpret the meanings of textures. In a series of trials, you indicated which textured bars best correspond to concepts from a given list.</p>' +
                '<p>We are interested in understanding how the textures used in the bars affect which concepts people assign to each bar.</p>' +
                '<p>Thank you for participating! We appreciate your time and effort in completing the study.</p>' +
                '<p>You may press the "esc" key to end the experiment and exit full screen.</p>' +
                '</div>',
            choices: ['Escape']
        }
        timeline.push(debrief_script);

        //Exit fullscreen
        timeline.push({
            type: jsPsychFullscreen,
            fullscreen_mode: false
        })

        console.log("Timeline contents:", timeline);

        //Run the experiment
        jsPsych.run(timeline);
        /*jsPsych.run(timeline).then(() => {
            if (sona_id) {
                window.location.href = `https://uwmadison.sona-systems.com/webstudy_credit.aspx?experiment_id=1652&credit_token=ea076512702d447d87e368a354e37fd9&survey_code=` + sona_id;
            }
        });*/
    }
    startExperiment();

</script>

</html>
